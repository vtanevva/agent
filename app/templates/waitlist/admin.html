<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aivis Beta - Waitlist Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #FDFFFC 0%, #F8FAF7 100%);
            min-height: 100vh;
            padding: 20px;
            color: #012622;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(50, 22, 31, 0.2);
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #012622;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #012622;
            opacity: 0.7;
            margin-bottom: 30px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: #F8FAF7;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(50, 22, 31, 0.1);
            flex: 1;
            min-width: 150px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #012622;
        }
        
        .stat-label {
            font-size: 14px;
            color: #012622;
            opacity: 0.6;
            margin-top: 5px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #012622;
            color: white;
        }
        
        .btn-primary:hover {
            background: #011A1C;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #F8FAF7;
            color: #012622;
            border: 1px solid rgba(50, 22, 31, 0.2);
        }
        
        .btn-secondary:hover {
            background: #F0F4EF;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #012622;
            opacity: 0.6;
        }
        
        .error {
            background: #F8FAF7;
            border: 1px solid rgba(118, 91, 89, 0.4);
            color: #6A4E4C;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th {
            background: #F8FAF7;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #012622;
            border-bottom: 2px solid rgba(50, 22, 31, 0.2);
            font-size: 14px;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid rgba(50, 22, 31, 0.1);
            font-size: 14px;
        }
        
        tr:hover {
            background: #F8FAF7;
        }
        
        .email {
            color: #012622;
            font-weight: 500;
        }
        
        .date {
            color: #012622;
            opacity: 0.6;
            font-size: 13px;
        }
        
        .referral {
            color: #012622;
            opacity: 0.8;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #012622;
            opacity: 0.6;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 8px;
            }
            
            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aivis Beta Waitlist</h1>
        <p class="subtitle">View all signups</p>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">-</div>
                <div class="stat-label">Total Signups</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayCount">-</div>
                <div class="stat-label">Today</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="loadWaitlist()">Refresh</button>
            <button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
        
        <div id="error"></div>
        <div id="loading" class="loading">Loading waitlist entries...</div>
        <div id="tableContainer" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Referral Source</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        let waitlistData = [];
        
        async function loadWaitlist() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const tableContainer = document.getElementById('tableContainer');
            const tableBody = document.getElementById('tableBody');
            
            loading.style.display = 'block';
            error.innerHTML = '';
            tableContainer.style.display = 'none';
            
            try {
                const response = await fetch('/api/waitlist/list');
                const data = await response.json();
                
                if (data.success) {
                    waitlistData = data.entries || [];
                    displayWaitlist(waitlistData);
                    updateStats(waitlistData);
                } else {
                    error.innerHTML = '<div class="error">Error: ' + (data.error || 'Failed to load waitlist') + '</div>';
                }
            } catch (err) {
                error.innerHTML = '<div class="error">Network error: ' + err.message + '</div>';
            } finally {
                loading.style.display = 'none';
            }
        }
        
        function displayWaitlist(entries) {
            const tableBody = document.getElementById('tableBody');
            const tableContainer = document.getElementById('tableContainer');
            
            if (entries.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="no-data">No signups yet</td></tr>';
            } else {
                tableBody.innerHTML = entries.map(entry => {
                    const date = entry.created_at ? new Date(entry.created_at).toLocaleString() : 'N/A';
                    const referral = entry.referral_source || '-';
                    return `
                        <tr>
                            <td>${escapeHtml(entry.name || '')}</td>
                            <td class="email">${escapeHtml(entry.email || '')}</td>
                            <td class="referral">${escapeHtml(referral)}</td>
                            <td class="date">${date}</td>
                        </tr>
                    `;
                }).join('');
            }
            
            tableContainer.style.display = 'block';
        }
        
        function updateStats(entries) {
            const total = entries.length;
            const today = new Date().toDateString();
            const todayCount = entries.filter(entry => {
                if (!entry.created_at) return false;
                const entryDate = new Date(entry.created_at).toDateString();
                return entryDate === today;
            }).length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('todayCount').textContent = todayCount;
        }
        
        function exportCSV() {
            if (waitlistData.length === 0) {
                alert('No data to export');
                return;
            }
            
            const headers = ['Name', 'Email', 'Referral Source', 'Date'];
            const rows = waitlistData.map(entry => {
                const date = entry.created_at ? new Date(entry.created_at).toLocaleString() : '';
                return [
                    entry.name || '',
                    entry.email || '',
                    entry.referral_source || '',
                    date
                ];
            });
            
            const csv = [
                headers.join(','),
                ...rows.map(row => row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(','))
            ].join('\\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'aivis-waitlist-' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function logout() {
            try {
                await fetch('/api/waitlist/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                window.location.reload();
            } catch (err) {
                console.error('Logout error:', err);
            }
        }
        
        // Load on page load
        loadWaitlist();
    </script>
</body>
</html>
