<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aivis Beta - Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #FDFFFC 0%, #F8FAF7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(50, 22, 31, 0.2);
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #012622;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #012622;
            opacity: 0.7;
            margin-bottom: 30px;
            text-align: center;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #012622;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(50, 22, 31, 0.2);
            border-radius: 8px;
            font-size: 16;
            background: #F8FAF7;
            color: #012622;
        }
        
        input:focus {
            outline: none;
            border-color: #012622;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: #012622;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #011A1C;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .error {
            background: #F8FAF7;
            border: 1px solid rgba(118, 91, 89, 0.4);
            color: #6A4E4C;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            color: #012622;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Login</h1>
        <p class="subtitle">Enter password to access waitlist admin</p>
        
        <div id="error"></div>
        <div id="loading" class="loading" style="display: none;">Logging in...</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>
            <button type="submit" class="btn" id="submitBtn">Login</button>
        </form>
    </div>
    
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');
            
            errorDiv.innerHTML = '';
            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/api/waitlist/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password }),
                    credentials: 'same-origin'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.reload();
                } else {
                    errorDiv.innerHTML = '<div class="error">' + (data.error || 'Invalid password') + '</div>';
                }
            } catch (err) {
                errorDiv.innerHTML = '<div class="error">Network error: ' + err.message + '</div>';
            } finally {
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
